name: API checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: scaleio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scaleio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=scaleio_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Scale.io_API.sln
      - run: dotnet build Scale.io_API.sln --configuration Release --no-restore --warnaserror
      - run: dotnet test Scale.io_API.sln --configuration Release --no-build --logger trx
      - run: docker build --file API/Dockerfile --tag scaleio-production:check .
      - run: docker build --target dev --file API/Dockerfile --tag scaleio-development:check .
      - run: bash scripts/docker-smoke.sh
      - name: Export validated production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p image-artifact
          docker image inspect scaleio-production:check --format '{{.Id}}' > image-artifact/image-id.txt
          docker save scaleio-production:check | gzip > image-artifact/production.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-image
          path: image-artifact/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
