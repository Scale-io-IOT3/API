name: Deploy API
on:
    workflow_run:
        workflows: ["API checks"]
        types: [completed]
        branches: [main]
permissions:
    contents: read
jobs:
    deploy:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
        name: Deploy app
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Install Flyctl
              uses: superfly/flyctl-actions/setup-flyctl@master

            - name: Deploy
              run: flyctl deploy --remote-only --yes
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
