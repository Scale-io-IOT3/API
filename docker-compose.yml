services:
    postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        environment:
            - POSTGRES_DB=scaleio
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d scaleio" ]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data

    scale.io:
        # Empty platform uses the Docker host architecture; override for emulation.
        platform: ${API_DOCKER_PLATFORM:-}
        init: true
        stop_grace_period: 30s
        build:
            context: .
            dockerfile: API/Dockerfile
            target: dev
        volumes:
            - ./:/app
            - nuget_cache:/root/.nuget/packages
            # Keep Linux build assets out of the host editor's project directories.
            - /app/API/bin
            - /app/API/obj
            - /app/Core/bin
            - /app/Core/obj
            - /app/Infrastructure/bin
            - /app/Infrastructure/obj
            - /app/Tests/bin
            - /app/Tests/obj
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
            interval: 1m30s
            timeout: 10s
            retries: 3
            start_period: 40s
            start_interval: 5s
        ports:
            - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5175}:8080"
        env_file:
            - path: API/.env
              required: false
        environment:
            - DATABASE_URL=Host=postgres;Port=5432;Database=scaleio;Username=postgres;Password=postgres
            - ASPNETCORE_ENVIRONMENT=Development
            - DOTNET_RUNNING_IN_CONTAINER=true
            - API_WATCH_MODE=${API_WATCH_MODE:-off}
            - DOTNET_USE_POLLING_FILE_WATCHER=1
            - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=true
        depends_on:
            postgres:
                condition: service_healthy
        restart: on-failure

volumes:
    postgres_data:
    nuget_cache:
